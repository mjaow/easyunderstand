<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Understand video · EasyUnderstand</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
<template id="panel-template">
<header><div class="brand"><span class="mark">e</span> EasyUnderstand <span id="panel-tag" class="tag">VIDEO</span></div><h1 id="panel-heading">Understand video</h1><p id="video-title">Open a YouTube video to get started.</p></header>
<main>
  <div class="toolbar"><button id="understand" class="primary" disabled hidden>Understand video</button><button id="plan-watch" class="primary" disabled hidden title="Plan what to focus on or skip from the title, description, and captions.">Plan watch</button><button id="cancel" hidden>Cancel</button><button id="clear-cache" title="Delete all locally saved video summaries, translations, and watch plans and clear this panel.">Clear cache</button></div>
  <p id="status" role="status" aria-live="polite">Opening your video…</p>
  <div id="error" role="alert" hidden></div>
  <div id="summary-timing-view"><section id="timing" hidden aria-label="Summary timing"><div class="timing-heading"><span id="timing-label">Elapsed</span><strong id="timing-total"></strong></div>
    <p class="meta"><span id="timing-model"></span><span id="timing-source" hidden></span></p>
    <dl>
      <div><dt>Transcript loading</dt><dd id="timing-transcript"></dd></div>
      <div><dt>Model request</dt><dd id="timing-request"></dd></div>
    </dl>
    <details id="timing-app-details"><summary>App setup &amp; display <span id="timing-app"></span></summary>
      <dl>
        <div><dt>Open sidebar<small>Open the summary panel in your browser.</small></dt><dd id="timing-opening"></dd></div>
        <div><dt>Connect to app<small>Start or reconnect to the background app. Time overlapping caption loading is excluded.</small></dt><dd id="timing-connection"></dd></div>
        <div><dt>Prepare and deliver<small>Prepare the request, load or save the cached summary, and pass the answer back.</small></dt><dd id="timing-transfer"></dd></div>
        <div><dt>Show summary<small>Draw the answer on screen.</small></dt><dd id="timing-display"></dd></div>
      </dl>
    </details>
    <p id="timing-note" class="meta"></p>
  </section>
  </div>
  <div id="source-meta" class="meta"></div>
  <div id="transcript-size" class="meta" hidden></div>
  <section id="watch-plan-section" hidden aria-labelledby="watch-heading">
    <div class="eyebrow">YOUR WATCH PLAN</div>
    <h2 id="watch-heading">Spend your attention where it matters.</h2>
    <p id="watch-status" class="meta" role="status" aria-live="polite"></p>
    <div id="watch-result" hidden>
      <p id="watch-overview"></p>
      <p id="watch-estimate"></p>
      <p class="meta">Purpose inferred from the title and description; section recommendations grounded in captions. Check visuals for equations, slides, and demonstrations. Skips are conditional.</p>
      <button id="next-focus" type="button">Next focus section</button>
      <div id="watch-ranges"></div>
    </div>
  </section>
  <div id="summary-view"><nav id="languages" hidden aria-label="Analysis actions"><button id="english" aria-pressed="true">English</button><button id="chinese" aria-pressed="false">Translate to Chinese</button><button id="copy-summary" disabled title="Copy the current language: summary, every breakdown, critical assessment and timestamp links, including collapsed sections.">Copy summary + breakdown</button><p id="copy-status" role="status" aria-live="polite"></p></nav>
  <section id="overview-card" hidden><div class="eyebrow">SUMMARY</div><div id="overview"></div><div id="takeaways-section" hidden><h2>Key takeaways</h2><ul id="takeaways"></ul></div><details id="connections-details" hidden><summary>How the ideas connect</summary><p id="connections"></p></details></section>
  <details id="ideas-section" hidden><summary>Explore the breakdown <span id="idea-count" class="meta"></span></summary><div id="ideas"></div></details>
  <details id="evaluation-section" hidden><summary>Critical assessment <span id="evaluation-count" class="meta"></span></summary><p class="meta">Model assessment of the transcript's evidence and reasoning. External facts have not been checked.</p><div id="evaluation"></div></details>
  <section id="unanswered-section" hidden><h2>Left unresolved</h2><ul id="unanswered"></ul></section>
  <section id="questions-section" hidden><h2>Explore further</h2><div id="conversation" aria-live="polite"></div><form id="question-form"><label for="question">Ask about this video</label><textarea id="question" rows="2" maxlength="4000" placeholder="Ask about a concept, example, method or argument from the video."></textarea><button id="ask" class="primary" type="submit">Ask the transcript</button></form></section>
  </div>
  <details id="transcript-section" hidden><summary>Inspect the source transcript</summary><p class="meta">Captions can contain recognition errors. Visual content is not analyzed.</p><div id="transcript"></div></details>
  <footer><span id="panel-note"></span> <a href="help.html" target="_blank" rel="noreferrer">Setup &amp; help</a></footer>
</main></template><script type="module" src="sidepanel.js"></script>
</body></html>
